version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: civicfix-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: civicfix_ai
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civicfix-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      SERVER_URL: http://localhost:5000
      MONGODB_URI: mongodb://mongodb:27017/civicfix_ai
      JWT_SECRET: super_secure_civicfix_ai_jwt_secret_key_2026_sih_hackathon
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
    depends_on:
      - mongodb
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicfix-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
